name: TechFrio CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Lint & TypeCheck
        run: cd frontend && npm run lint && npm run typecheck
      - name: Unit Tests
        run: cd frontend && npm test

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore backend/TechFrio.sln
      - name: Build
        run: dotnet build backend/TechFrio.sln --no-restore -c Release
      - name: Unit Tests
        run: dotnet test backend/TechFrio.sln --no-build --verbosity normal

  docker-bake:
    needs: [frontend-build, backend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Push Images
        run: |
          echo "Building Docker images for TechFrio..."
          # docker build -t techfrio-frontend ./frontend
          # docker build -t techfrio-backend ./backend
